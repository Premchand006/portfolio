<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The ELITE Club Leadership">
  <defs>
    <linearGradient id="j-bg-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="j-glow-3" cx="0.55" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="rgba(212,175,55,0.30)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#j-bg-3)"/>
  <rect width="1200" height="900" fill="url(#j-glow-3)"/>
  <!-- abstract leadership: sun-burst star with hierarchy lines -->
  <g transform="translate(660,420)">
    <!-- outer rays -->
    <g stroke="#D4AF37" stroke-width="1.5" opacity="0.55">
      <line x1="0" y1="-260" x2="0" y2="-180"/>
      <line x1="0" y1="180" x2="0" y2="260"/>
      <line x1="-260" y1="0" x2="-180" y2="0"/>
      <line x1="180" y1="0" x2="260" y2="0"/>
      <line x1="-184" y1="-184" x2="-127" y2="-127"/>
      <line x1="184" y1="-184" x2="127" y2="-127"/>
      <line x1="-184" y1="184" x2="-127" y2="127"/>
      <line x1="184" y1="184" x2="127" y2="127"/>
    </g>
    <!-- mid rays -->
    <g stroke="#D4AF37" stroke-width="1" opacity="0.35">
      <line x1="-220" y1="-90" x2="-160" y2="-65"/>
      <line x1="220" y1="-90" x2="160" y2="-65"/>
      <line x1="-90" y1="-220" x2="-65" y2="-160"/>
      <line x1="90" y1="-220" x2="65" y2="-160"/>
      <line x1="-220" y1="90" x2="-160" y2="65"/>
      <line x1="220" y1="90" x2="160" y2="65"/>
      <line x1="-90" y1="220" x2="-65" y2="160"/>
      <line x1="90" y1="220" x2="65" y2="160"/>
    </g>
    <!-- core star (5-point) -->
    <polygon
      points="0,-100 23,-31 96,-31 37,11 60,80 0,38 -60,80 -37,11 -96,-31 -23,-31"
      fill="rgba(212,175,55,0.18)" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#D4AF37"/>
  </g>
  <!-- hierarchy / org tree -->
  <g transform="translate(120,260)" stroke="rgba(212,175,55,0.5)" fill="none" stroke-width="1.5">
    <rect x="0" y="0" width="80" height="32" stroke-width="2"/>
    <line x1="40" y1="32" x2="40" y2="60"/>
    <line x1="0" y1="60" x2="80" y2="60"/>
    <line x1="0" y1="60" x2="0" y2="80"/>
    <line x1="80" y1="60" x2="80" y2="80"/>
    <rect x="-20" y="80" width="40" height="20"/>
    <rect x="60" y="80" width="40" height="20"/>
  </g>
  <text x="120" y="376" font-family="JetBrains Mono, monospace" font-size="12" fill="rgba(212,175,55,0.7)" letter-spacing="2">VICE PRESIDENT</text>
  <text x="80" y="780" font-family="Syne, sans-serif" font-size="40" font-weight="700" fill="#F5F5F5">ELITE Club Leadership</text>
  <text x="80" y="820" font-family="Inter, sans-serif" font-size="18" fill="rgba(245,245,245,0.6)">Vice President · Aug 2024 — present</text>
  <text x="80" y="100" font-family="Inter, sans-serif" font-size="12" fill="#D4AF37" letter-spacing="4">MILESTONE 03</text>
</svg>
