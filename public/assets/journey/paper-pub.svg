<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Published First IEEE Paper">
  <defs>
    <linearGradient id="j-bg-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#j-bg-2)"/>
  <!-- subtle margin rule -->
  <line x1="80" y1="120" x2="80" y2="880" stroke="rgba(212,175,55,0.15)" stroke-width="1"/>
  <!-- stacked papers -->
  <g transform="translate(640,250)">
    <!-- back paper -->
    <rect x="40" y="40" width="380" height="500" fill="#0a0a0a" stroke="rgba(212,175,55,0.25)" stroke-width="1.5" transform="rotate(-4 230 290)"/>
    <!-- mid paper -->
    <rect x="20" y="20" width="380" height="500" fill="#0d0d0d" stroke="rgba(212,175,55,0.4)" stroke-width="1.5" transform="rotate(-1 210 270)"/>
    <!-- front paper -->
    <rect x="0" y="0" width="380" height="500" fill="#101010" stroke="#D4AF37" stroke-width="2"/>
    <!-- paper content lines -->
    <g stroke="rgba(245,245,245,0.6)" stroke-width="2" stroke-linecap="round">
      <line x1="30" y1="60" x2="290" y2="60"/>
      <line x1="30" y1="80" x2="200" y2="80"/>
    </g>
    <text x="30" y="125" font-family="Inter, sans-serif" font-size="11" fill="rgba(245,245,245,0.45)" letter-spacing="1">K. L. K. M. P. C. KORUKONDA et al.</text>
    <g stroke="rgba(245,245,245,0.18)" stroke-width="1" stroke-linecap="round">
      <line x1="30" y1="160" x2="350" y2="160"/>
      <line x1="30" y1="180" x2="350" y2="180"/>
      <line x1="30" y1="200" x2="280" y2="200"/>
      <line x1="30" y1="240" x2="350" y2="240"/>
      <line x1="30" y1="260" x2="320" y2="260"/>
      <line x1="30" y1="280" x2="350" y2="280"/>
      <line x1="30" y1="300" x2="200" y2="300"/>
    </g>
    <!-- gold accent block (figure) -->
    <rect x="30" y="340" width="320" height="100" fill="rgba(212,175,55,0.10)" stroke="rgba(212,175,55,0.45)" stroke-width="1"/>
    <text x="190" y="395" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="rgba(212,175,55,0.75)" letter-spacing="2">FIGURE 1 · ARCHITECTURE</text>
    <g stroke="rgba(245,245,245,0.18)" stroke-width="1" stroke-linecap="round">
      <line x1="30" y1="465" x2="350" y2="465"/>
      <line x1="30" y1="485" x2="280" y2="485"/>
    </g>
  </g>
  <!-- IEEE badge -->
  <g transform="translate(120,260)">
    <rect x="0" y="0" width="180" height="60" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="90" y="38" text-anchor="middle" font-family="Syne, sans-serif" font-size="22" font-weight="700" fill="#D4AF37" letter-spacing="3">IEEE</text>
  </g>
  <text x="120" y="370" font-family="Inter, sans-serif" font-size="13" fill="rgba(245,245,245,0.5)" letter-spacing="2">ICCSC 2025</text>
  <text x="120" y="400" font-family="Inter, sans-serif" font-size="13" fill="rgba(245,245,245,0.5)" letter-spacing="2">DOI · INDEXED</text>
  <text x="80" y="780" font-family="Syne, sans-serif" font-size="40" font-weight="700" fill="#F5F5F5">First IEEE Paper</text>
  <text x="80" y="820" font-family="Inter, sans-serif" font-size="18" fill="rgba(245,245,245,0.6)">AI-Driven Financial Guidance · Feb 2025</text>
  <text x="80" y="100" font-family="Inter, sans-serif" font-size="12" fill="#D4AF37" letter-spacing="4">MILESTONE 02</text>
</svg>
