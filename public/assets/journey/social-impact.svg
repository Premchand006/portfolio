<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sustainable Development Goal Project">
  <defs>
    <linearGradient id="j-bg-4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="j-sun" cx="0.5" cy="0.3" r="0.45">
      <stop offset="0%" stop-color="rgba(212,175,55,0.45)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#j-bg-4)"/>
  <rect width="1200" height="900" fill="url(#j-sun)"/>
  <!-- horizon -->
  <line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(212,175,55,0.35)" stroke-width="1"/>
  <!-- sun -->
  <circle cx="600" cy="380" r="80" fill="rgba(212,175,55,0.18)" stroke="#D4AF37" stroke-width="2"/>
  <!-- village silhouette -->
  <g transform="translate(0,540)" fill="rgba(245,245,245,0.10)" stroke="rgba(212,175,55,0.45)" stroke-width="1.5">
    <!-- house 1 -->
    <polygon points="200,-60 240,-110 280,-60 280,0 200,0"/>
    <rect x="220" y="-30" width="20" height="30" fill="rgba(212,175,55,0.20)" stroke="none"/>
    <!-- house 2 -->
    <polygon points="320,-70 380,-130 440,-70 440,0 320,0"/>
    <rect x="350" y="-40" width="24" height="40" fill="rgba(212,175,55,0.20)" stroke="none"/>
    <!-- house 3 -->
    <polygon points="500,-50 540,-100 580,-50 580,0 500,0"/>
    <!-- house 4 -->
    <polygon points="640,-80 700,-140 760,-80 760,0 640,0"/>
    <rect x="668" y="-50" width="24" height="50" fill="rgba(212,175,55,0.20)" stroke="none"/>
    <!-- house 5 -->
    <polygon points="820,-60 860,-110 900,-60 900,0 820,0"/>
    <!-- trees -->
    <circle cx="120" cy="-30" r="22" stroke-width="1"/>
    <line x1="120" y1="-8" x2="120" y2="0" stroke-width="2"/>
    <circle cx="980" cy="-26" r="20" stroke-width="1"/>
    <line x1="980" y1="-6" x2="980" y2="0" stroke-width="2"/>
    <circle cx="1080" cy="-32" r="24" stroke-width="1"/>
    <line x1="1080" y1="-8" x2="1080" y2="0" stroke-width="2"/>
  </g>
  <!-- people icons (5 dots = 500+ households) -->
  <g transform="translate(640,640)" fill="rgba(212,175,55,0.55)">
    <circle cx="0" cy="0" r="6"/>
    <circle cx="20" cy="0" r="6"/>
    <circle cx="40" cy="0" r="6"/>
    <circle cx="60" cy="0" r="6"/>
    <circle cx="80" cy="0" r="6"/>
    <text x="100" y="4" font-family="JetBrains Mono, monospace" font-size="13" fill="#D4AF37" letter-spacing="2">500+</text>
  </g>
  <!-- SDG ribbon -->
  <g transform="translate(120,220)">
    <rect x="0" y="0" width="180" height="28" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="90" y="20" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#D4AF37" letter-spacing="3">SDG · KERALA</text>
  </g>
  <text x="80" y="780" font-family="Syne, sans-serif" font-size="40" font-weight="700" fill="#F5F5F5">SDG Project</text>
  <text x="80" y="820" font-family="Inter, sans-serif" font-size="18" fill="rgba(245,245,245,0.6)">Live-in-Labs · 500+ households · June 2024</text>
  <text x="80" y="100" font-family="Inter, sans-serif" font-size="12" fill="#D4AF37" letter-spacing="4">MILESTONE 04</text>
</svg>
