<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Smart City Hackathon 2024">
  <defs>
    <linearGradient id="j-bg-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="j-glow-1" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="rgba(212,175,55,0.35)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#j-bg-1)"/>
  <rect width="1200" height="900" fill="url(#j-glow-1)"/>
  <!-- circuit traces -->
  <g fill="none" stroke="rgba(212,175,55,0.18)" stroke-width="1">
    <path d="M0 200 H 280 V 360 H 540"/>
    <path d="M1200 700 H 920 V 540 H 660"/>
    <path d="M0 720 H 200 V 800"/>
    <path d="M1200 180 H 1000 V 100"/>
  </g>
  <g fill="#D4AF37" opacity="0.6">
    <circle cx="280" cy="200" r="3"/>
    <circle cx="540" cy="360" r="3"/>
    <circle cx="920" cy="700" r="3"/>
    <circle cx="660" cy="540" r="3"/>
  </g>
  <!-- trophy -->
  <g transform="translate(600,330)">
    <path d="M -90 -120 L 90 -120 L 75 60 L -75 60 Z" fill="rgba(212,175,55,0.12)" stroke="#D4AF37" stroke-width="2.5"/>
    <path d="M -90 -90 Q -150 -60 -150 0 Q -150 40 -100 40" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <path d="M 90 -90 Q 150 -60 150 0 Q 150 40 100 40" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <path d="M -50 60 L -60 100 L 60 100 L 50 60 Z" fill="rgba(212,175,55,0.18)" stroke="#D4AF37" stroke-width="2"/>
    <rect x="-90" y="100" width="180" height="20" fill="#D4AF37"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Syne, sans-serif" font-size="56" font-weight="700" fill="#D4AF37">1</text>
  </g>
  <text x="80" y="780" font-family="Syne, sans-serif" font-size="40" font-weight="700" fill="#F5F5F5">Smart City Hackathon</text>
  <text x="80" y="820" font-family="Inter, sans-serif" font-size="18" fill="rgba(245,245,245,0.6)">First place · National level · March 2024</text>
  <text x="80" y="100" font-family="Inter, sans-serif" font-size="12" fill="#D4AF37" letter-spacing="4">MILESTONE 01</text>
</svg>
